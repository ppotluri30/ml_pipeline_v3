# inference-worker Deployment
# Kafka consumer for batch inference jobs
# Does NOT receive HTTP traffic - only consumes from Kafka topics
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker
  namespace: default
  labels:
    app: inference-worker
    component: kafka-consumer
    tier: worker
spec:
  replicas: 1  # Single worker sufficient for 1 partition per topic
  selector:
    matchLabels:
      app: inference-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: inference-worker
        component: kafka-consumer
        tier: worker
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'echo Waiting for Kafka...; while ! nc -z kafka 9092; do sleep 1; done; echo Kafka is up!']
      containers:
        - name: inference-worker
          image: inference-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              value: minioadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: minioadmin
            - name: CONSUMER_GROUP_ID
              value: inference-worker
            - name: CONSUMER_TOPIC_0
              value: inference-data
            - name: CONSUMER_TOPIC_1
              value: model-training
            - name: PROMOTION_TOPIC
              value: model-selected
            - name: GATEWAY_URL
              value: http://fastapi-app:8000
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio:9000
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: IDENTIFIER
              value: default
            # Production Kafka settings with backpressure
            - name: USE_MANUAL_COMMIT
              value: "true"
            - name: FETCH_MAX_WAIT_MS
              value: "500"
            - name: MAX_POLL_RECORDS
              value: "10"
            - name: POLL_TIMEOUT_MS
              value: "1000"
            - name: IDLE_SLEEP_SECONDS
              value: "0.5"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - cat
                - /tmp/worker-healthy
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - cat
                - /tmp/worker-healthy
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
