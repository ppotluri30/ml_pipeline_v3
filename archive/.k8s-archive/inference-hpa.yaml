apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-hpa
  labels:
    app: inference
    autoscaling-strategy: cpu-based
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference
  minReplicas: 3  # Baseline for production availability (minimum to handle partition count)
  maxReplicas: 8  # Balanced for node capacity (1 CPU × 8 pods = 8 CPUs)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 250  # Scale when CPU > 250% (matches baseline idle ~238m on 100m request)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30  # Brief stabilization to avoid flapping
      policies:
        - type: Pods
          value: 2  # Add 2 pods per cycle
          periodSeconds: 15
        - type: Percent
          value: 50  # Or add 50% of current pods
          periodSeconds: 15
      selectPolicy: Max  # Choose most aggressive scale-up policy
    scaleDown:
      stabilizationWindowSeconds: 180  # 3-minute cooldown (reduced from 5min for faster response)
      policies:
        - type: Pods
          value: 1  # Remove 1 pod at a time
          periodSeconds: 45  # Faster scale-down cycles (was 60s)
        - type: Percent
          value: 15  # Or remove 15% of current pods (was 10%)
          periodSeconds: 90  # Faster evaluation (was 120s)
      selectPolicy: Min  # Choose most conservative scale-down policy
