---
# KEDA ScaledObject for SLO-driven autoscaling
# Requires: helm install keda kedacore/keda --namespace keda --create-namespace
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: inference-slo-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: inference
  
  minReplicaCount: 5
  maxReplicaCount: 12
  
  pollingInterval: 10  # Check metrics every 10s (faster detection)
  cooldownPeriod: 180  # Wait 3 minutes before scaling down
  
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
          - type: Pods
            value: 2
            periodSeconds: 30
          - type: Percent
            value: 50
            periodSeconds: 30
          selectPolicy: Max
        
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Pods
            value: 1
            periodSeconds: 60
          - type: Percent
            value: 10
            periodSeconds: 120
          selectPolicy: Min
  
  # Triggers (OR semantics - scale if ANY trigger fires)
  triggers:
  
  # Trigger 1: P95 Latency > 250ms (tuned for Phase-5 performance: baseline p95=190ms)
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-server.default.svc.cluster.local:80
      metricName: inference_latency_p95
      query: |
        histogram_quantile(0.95,
          sum(rate(inference_latency_seconds_bucket[2m])) by (le)
        )
      threshold: "0.25"  # 250ms in seconds (scale up when p95 exceeds this)
      activationThreshold: "0.15"  # 150ms (activate scaler, prevent premature scale-down)

---
