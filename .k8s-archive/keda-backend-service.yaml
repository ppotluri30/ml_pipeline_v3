---
# Backend service for KEDA HTTP interceptor to proxy to
# This service points to actual inference-http pods
# Clients should connect to interceptor proxy, not this service directly
apiVersion: v1
kind: Service
metadata:
  name: inference-http
  labels:
    app: inference-http
    keda-managed: "true"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: inference-http
