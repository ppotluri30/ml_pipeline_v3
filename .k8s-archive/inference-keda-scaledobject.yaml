apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: inference-slo-scaler
  namespace: default
  labels:
    app: inference
    component: ml-inference
spec:
  scaleTargetRef:
    name: inference
  minReplicaCount: 5  # Production baseline - prevent latency collapse
  maxReplicaCount: 10  # Reduced to prevent node saturation (was 20)
  pollingInterval: 10  # Check metrics every 10 seconds (was 15)
  cooldownPeriod: 180  # Wait 3 minutes before scaling down
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30  # Faster scale-up (was 60)
          policies:
          - type: Pods
            value: 2  # Add 2 pods per cycle
            periodSeconds: 15  # Every 15 seconds (was 30)
          - type: Percent
            value: 50  # Or 50% of current
            periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300  # Keep 5 minutes (was 180)
          policies:
          - type: Pods
            value: 1  # Remove 1 pod per cycle
            periodSeconds: 60  # Every 60 seconds (was 120)
          - type: Percent
            value: 10  # Or 10% of current (was 25%)
            periodSeconds: 120
          selectPolicy: Min
  triggers:
  # Primary driver: p95 latency > 200ms (effective threshold after HPA per-pod division)
  # NOTE: HPA divides external metrics by pod count. With minReplicas=5, threshold must be 200ms * 5 = 1000ms
  # This ensures HPA sees: 1000ms / 5 pods = 200ms per pod, triggering at desired 200ms actual latency
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-server.default.svc.cluster.local:80
      metricName: inference_latency_p95
      query: |
        histogram_quantile(0.95, 
          sum(rate(inference_latency_seconds_bucket[2m])) by (le)
        )
      threshold: "1.0"  # Scale if p95 > 1.0s (HPA divides by 5 pods = 200ms effective threshold)
      activationThreshold: "0.5"  # Activate if p95 > 0.5s (100ms effective after division)
  # Secondary driver: queue length > 20 jobs
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-server.default.svc.cluster.local:80
      metricName: inference_queue_length_avg
      query: |
        avg(inference_queue_len)
      threshold: "20"
      activationThreshold: "10"
  # Note: CPU/Memory triggers temporarily disabled for load test (require resource requests)
