# FastAPI Gateway Application
# MinIO proxy/gateway service for the ML pipeline
# GKE Compatible
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
  namespace: default
  labels:
    app: fastapi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z minio 9000; do
                echo "Waiting for MinIO..."
                sleep 2
              done
              echo "MinIO is available"
      containers:
        - name: fastapi-app
          # Image will be replaced by kustomize to: REGION-docker.pkg.dev/PROJECT_ID/REPO/fastapi-app:TAG
          image: fastapi-app:latest
          imagePullPolicy: Always
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_DEFAULT_BUCKET
              value: dataset
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-app
  namespace: default
  labels:
    app: fastapi-app
spec:
  type: ClusterIP  # Internal service
  selector:
    app: fastapi-app
  ports:
    - name: http
      port: 8000
      targetPort: 8000
