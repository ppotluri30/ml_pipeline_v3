# Eval Deployment and Service
# Model evaluation and promotion service
# GKE Compatible - uses standard Kubernetes APIs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval
  namespace: default
  labels:
    app: eval
    tier: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval
  template:
    metadata:
      labels:
        app: eval
        tier: pipeline
    spec:
      # Note: serviceAccountName removed - no Role/RoleBinding permissions
      # Eval will write promotion pointers to MinIO instead of patching deployments
      containers:
        - name: eval
          # Image will be replaced by kustomize to: REGION-docker.pkg.dev/PROJECT_ID/REPO/eval:TAG
          image: eval:latest
          imagePullPolicy: Always  # Changed from IfNotPresent for GKE to pull from registry
          env:
            # Kafka configuration
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: MODEL_TRAINING_TOPIC
              value: model-training
            - name: MODEL_SELECTED_TOPIC
              value: model-selected
            - name: DLQ_MODEL_SELECTED
              value: DLQ-model-selected
            - name: EVAL_GROUP_ID
              value: eval-promoter
            # MLflow configuration
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio:9000
            # MinIO/S3 credentials - REPLACE with GCS or your object storage credentials
            - name: AWS_ACCESS_KEY_ID
              value: minioadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: minioadmin
            - name: AWS_S3_ADDRESSING_STYLE
              value: path
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            # Gateway and promotion configuration
            - name: GATEWAY_URL
              value: http://fastapi-app:8000
            - name: PROMOTION_BUCKET
              value: model-promotion
            - name: LOOKBACK_RUNS
              value: "50"
            - name: IDENTIFIER
              value: default
            - name: EXPECTED_MODEL_TYPES
              value: GRU,LSTM,PROPHET
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 8050
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8050
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8050
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eval
  namespace: default
  labels:
    app: eval
spec:
  type: ClusterIP  # Internal service
  selector:
    app: eval
  ports:
    - name: http
      port: 8050
      targetPort: 8050
