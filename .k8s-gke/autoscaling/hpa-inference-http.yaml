# HorizontalPodAutoscaler for inference-http
# CPU-based autoscaling (no KEDA or Prometheus required)
# Works with standard Kubernetes RBAC - no cluster-admin needed
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-http-hpa
  namespace: default
  labels:
    app: inference-http
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-http
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes before scaling down
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
