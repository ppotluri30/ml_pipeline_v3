data:
  prometheus.yml: |
    global:
      scrape_interval: 1m
      scrape_timeout: 10s
      evaluation_interval: 1m
    scrape_configs:
    - job_name: inference-http-fast
      scrape_interval: 15s
      scrape_timeout: 10s
      metrics_path: /prometheus
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - default
      relabel_configs:
      - action: keep
        regex: inference-http
        source_labels:
        - __meta_kubernetes_pod_label_app
      - action: replace
        regex: (.+)
        replacement: $1:8000
        source_labels:
        - __meta_kubernetes_pod_ip
        target_label: __address__
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
