# inference-http Deployment
# HTTP-only inference service for serving predictions via REST API
# Scaled by KEDA based on Prometheus RPS and latency metrics
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-http
  namespace: default
  labels:
    app: inference-http
    component: http-server
    tier: serving
spec:
  replicas: 2  # Managed by KEDA ScaledObject (minReplicaCount)
  selector:
    matchLabels:
      app: inference-http
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: inference-http
        component: http-server
        tier: serving
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: inference-http
          image: inference-http:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: AWS_ACCESS_KEY_ID
              value: minioadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: minioadmin
            - name: GATEWAY_URL
              value: http://fastapi-app:8000
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio:9000
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: IDENTIFIER
              value: default
            - name: UVICORN_WORKERS
              value: "2"
            - name: UVICORN_TIMEOUT_KEEP_ALIVE
              value: "60"
            - name: UVICORN_LIMIT_CONCURRENCY
              value: "1000"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
